buildscript {
    repositories { mavenCentral(); maven { url 'https://maven.minecraftforge.net/' } }
    dependencies { classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') { changing = true } }
}
apply plugin: 'java'
apply plugin: 'forge'
version = '1.0.0'
group = 'com.coordinateportal'
archivesBaseName = 'CoordinatePortal-1.7.10'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { version = '1.7.10-10.13.4.1614-1.7.10'; runDir = 'run' }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand 'version':project.version, 'mcversion':project.minecraft.version }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
